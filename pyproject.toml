[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgrobust"
version = "0.1.0"
description = "Framework for evaluating wearable single-lead ECG classifiers under real recorded noise (AF detection as the worked example)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
